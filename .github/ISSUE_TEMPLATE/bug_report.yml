name: Bug report
description: Report reproducible behavior that does not work as intended.
title: ""
labels: []
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what were you trying to do?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the shortest steps, command, or example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, Python version, and Anthro Chess revision.
