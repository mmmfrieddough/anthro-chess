artifact_name = "lichess-univ-2018-01-2021-06"

# The Lichess universal export, every month that carries centisecond clocks and
# postdates the rapid pool split.
# `docs/decisions/0045-centisecond-clocks-from-a-closed-export.md` records why
# this source, this precision, and this span, and what the span costs, and
# `docs/decisions/0058-the-corpus-starts-after-the-rapid-pool-split.md` why it
# begins nine months after the clocks do.
#
# Preparation names no input against this selection and appends every archive
# of it that has been acquired, decoding as many at once as fill the machine.

[source]
id = "lichess"
version = "universal-2018-01-2021-06"
url = "https://database.lichess.org/db-univ/"
license = "CC0-1.0"
rating_namespace_prefix = "lichess"
rating_system = "glicko2"
ratings_are_normalized = true

[split]
# Deliberately the same seed the standard-export selection uses, not a new one.
# The two exports publish the same games under the same ids, so a fresh seed
# would reassign every one of them: measured over 200k ids, only 5.2% of the
# games held out by the existing selection stay held out under a different
# seed. Sharing the seed keeps the existing frozen pool held out against a
# model trained here.
seed = "anthro-lichess-blitz-baseline-v1"
validation_fraction = 0.05
test_fraction = 0.05
require_nonempty = true

[filters]
# Validity only, so every axis this corpus exists to keep measurable is left
# whole here and narrowed downstream.
# `docs/decisions/0062-the-breadth-corpus-filters-for-validity-alone.md` names
# those axes and says why an editorial filter here could never be detected.
#
# `speed`, `maximum_games` and `marked_accounts` are therefore absent by
# decision rather than by omission, and 0062 gives the reason for each. The
# last is the one to read before setting: it would pin today's census recall
# into a corpus that cannot be refiltered without re-parsing 42 archives.
minimum_plies = 1
require_rated = true
require_ratings = true
exclude_bots = true

[output]
games_per_shard = 50000

# 42 monthly archives, 3,136,069,223 games as the source publishes them.
# Digests are Lichess's own, from https://database.lichess.org/db-univ/sha256sums.txt

