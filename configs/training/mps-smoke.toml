run_name = "training-mps-smoke"
seed = 17
steps = 3
learning_rate = 0.003
log_every_steps = 1
gradient_accumulation_steps = 4
device = "mps"
precision = "float32"
determinism = "relaxed"
profile_phases = true

[model]
piece_embedding_dim = 2
action_embedding_dim = 4
model_dim = 16
attention_heads = 2
spatial_layers = 1
transformer_layers = 1
decision_layers = 1
feedforward_dim = 24
# Small deliberately: the `geometric_bias_dim` field docstring says why the
# cost of these two does not fall with `model_dim`.
geometric_token_dim = 1
geometric_bias_dim = 2
dropout = 0.0

[train]
normalized = "artifacts/lichess-sample/normalized"
manifest = "artifacts/lichess-sample/manifests/manifest.json"

[train.loader]
split = "train"
batch_size = 1
length_bucket_width = 32
shuffle = false
seed = "anthro-training-mps-smoke-v1"
drop_last = false

[validation]
normalized = "artifacts/lichess-sample/normalized"
manifest = "artifacts/lichess-sample/manifests/manifest.json"

[validation.loader]
split = "train"
batch_size = 1
length_bucket_width = 32
shuffle = false
seed = "anthro-validation-mps-smoke-v1"
drop_last = false
