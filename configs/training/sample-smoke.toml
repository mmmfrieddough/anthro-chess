run_name = "training-smoke"
seed = 17
steps = 3
learning_rate = 0.003
log_every_steps = 1
checkpoint_every_steps = 2
device = "cpu"
precision = "float32"
matmul_precision = "highest"
determinism = "strict"

# Compilation off: it costs a fixed charge at the first step that a run this
# short exists entirely below, and proving the device path does not need it.
compilation = "off"

[model]
piece_embedding_dim = 2
model_dim = 16
attention_heads = 2
layers = 1
feedforward_dim = 24
history_positions = 2
geometric_token_dim = 1
geometric_bias_dim = 2
dropout = 0.0

[train]
normalized = "artifacts/lichess-sample/normalized"
manifest = "artifacts/lichess-sample/manifests/manifest.json"

[train.loader]
split = "train"
positions_per_batch = 32
shuffle = false
seed = "anthro-training-smoke-v1"
drop_last = false

[validation]
normalized = "artifacts/lichess-sample/normalized"
manifest = "artifacts/lichess-sample/manifests/manifest.json"

[validation.loader]
split = "train"
batch_size = 1
length_bucket_width = 32
shuffle = false
seed = "anthro-validation-smoke-v1"
drop_last = false
