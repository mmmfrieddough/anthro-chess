# Baseline checkpoint for evaluation-harness work: the same model, optimizer,
# and batch settings as the bounded proof, retrained on a corpus that carries
# the held-out test partition. Prepare the selection first:
#
#   uv run anthro data prepare \
#     --config configs/data/lichess-blitz-2017-04.toml \
#     --set 'artifact_name="lichess-blitz-proof-30k-v3"' \
#     --set filters.maximum_games=30000 \
#     --set output.games_per_shard=30000
#
# Normalized and manifest paths are machine-specific and must be supplied at
# run time, the same convention the other training configs follow.
output_directory = "artifacts/training-blitz-30k-v3"
seed = 17
steps = 8000
learning_rate = 0.001
log_every_steps = 10
# Every hundredth step is retained so the held-out curve can be reconstructed
# after the fact instead of by stopping and resuming a run repeatedly.
checkpoint_every_steps = 100
gradient_accumulation_steps = 1
device = "mps"
precision = "float32"
determinism = "relaxed"
profile_phases = false

[model]
piece_embedding_dim = 8
action_embedding_dim = 16
model_dim = 64
attention_heads = 4
transformer_layers = 2
feedforward_dim = 128
dropout = 0.0

[train]
normalized = "artifacts/lichess-blitz-proof-30k-v3/normalized"
manifest = "artifacts/lichess-blitz-proof-30k-v3/manifests/manifest.json"

[train.loader]
split = "train"
batch_size = 16
length_bucket_width = 16
shuffle = true
seed = "anthro-lichess-blitz-baseline-train-v1"
drop_last = false

[validation]
normalized = "artifacts/lichess-blitz-proof-30k-v3/normalized"
manifest = "artifacts/lichess-blitz-proof-30k-v3/manifests/manifest.json"

[validation.loader]
split = "validation"
batch_size = 16
length_bucket_width = 16
shuffle = false
seed = "anthro-lichess-blitz-baseline-validation-v1"
drop_last = false
