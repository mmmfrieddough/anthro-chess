run_name = "training-lichess-blitz-proof"
seed = 17
steps = 2000
learning_rate = 0.001
log_every_steps = 10
checkpoint_every_steps = 100
gradient_accumulation_steps = 1
device = "mps"
precision = "float32"
determinism = "relaxed"
profile_phases = false

[model]
piece_embedding_dim = 8
action_embedding_dim = 16
model_dim = 64
attention_heads = 4
spatial_layers = 2
transformer_layers = 2
decision_layers = 1
feedforward_dim = 128
geometric_token_dim = 8
geometric_bias_dim = 16
dropout = 0.0

[train]
normalized = "artifacts/lichess-blitz-proof/normalized"
manifest = "artifacts/lichess-blitz-proof/manifests/manifest.json"

[train.loader]
split = "train"
batch_size = 16
length_bucket_width = 16
shuffle = true
seed = "anthro-lichess-blitz-baseline-train-v1"
drop_last = false

[validation]
normalized = "artifacts/lichess-blitz-proof/normalized"
manifest = "artifacts/lichess-blitz-proof/manifests/manifest.json"

[validation.loader]
split = "validation"
batch_size = 16
length_bucket_width = 16
shuffle = false
seed = "anthro-lichess-blitz-baseline-validation-v1"
drop_last = false
