# Whether a checkpoint reads the rating it is conditioned on.
#
# This is a correctness reading rather than a quality one. Nothing in it
# returns a pass or a fail: weak dependency on an undertrained checkpoint means
# the conditioning has not been learned yet, which is a different finding from
# a miswired input.
#
# The model selection is deliberately absent, so the reading uses the same
# machine-local default checkpoint the playable engine reads. Override it for
# one run with, for example:
#
#   anthro eval dependency --config <this file> --set model.run_path='"blitz-v3"'
pool = "artifacts/lichess-univ-2018-01-2021-06-test"
# The generation this reading is defined over. A superseded pool left at that
# path is refused rather than scored.
expected_pool_game_ids_sha256 = "8ff80e72aac7dadd07a418e0c951d3c56a1045a48cd74de903da00bc4525a94c"

[view]
# Its own view, because this reading pays seven forward passes per batch where
# the checkpoint reading pays one: every batch is scored under the true
# conditioning, under each corrupted one, and at each rating on the
# cross-conditioning grid. Sharing one view would have made the family that
# tolerates a smaller sample pay for the family that does not.
#
# Sized on the narrowest quantity, which is the shuffled degradation. Four
# independent draws at 2000 games put its spread at 0.0031, and it moved 0.0049
# across four times the training, clearing its floor by 1.34: close enough that
# one unlucky draw reads as no movement at all. Four times the games halves the
# floor and takes that to 2.64.
#
# Nothing here asks for finer. Detecting a dead input needs a fraction of this,
# since a degradation collapsing to zero is visible on a handful of games, and
# the separations this size cannot resolve are ones no decision turns on.
name = "rating-dependency"
maximum_games = 8000

[loader]
batch_size = 8
