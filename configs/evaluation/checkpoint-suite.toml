# Every benchmark in the harness, against one checkpoint, from one command.
#
# This is the default way a new checkpoint is evaluated. It composes the
# per-benchmark selections beside it rather than restating any of their
# settings: each step names a file, and the sweep supplies only the checkpoint,
# the order, and whether the reading is committed.
#
# The model selection is deliberately absent, so the sweep uses the same
# machine-local default checkpoint the playable engine reads. Override it for
# one run with, for example:
#
#   anthro eval suite --config <this file> \
#     --set model.run_path='"training-blitz-30k-v4"' \
#     --set model.checkpoint='"step-00008000.pt"'
#
# Every step runs at the one size its own selection declares. A cheaper reading
# is `--set` on the invocation that wants it, and it records under whatever
# series that size names.
#
# What a step costs is not written down here. Every recording step commits its
# own invocation cost beside its reading, so `anthro eval report` answers it
# from measurement rather than from a comment nothing can contradict; see
# `docs/decisions/0031-committed-benchmark-cost.md`.
name = "checkpoint"

# Cheapest first, so a broken checkpoint selection fails in seconds rather than
# after the first pool pass. Ordering beyond that is the declaration order here,
# except where a step's inputs force it.

[benchmarks.inference]
# What the checkpoint costs to play with. Reads no pool, and its cold-start
# reading wants a process that has not already loaded the model, which is why
# it runs before anything else.
config = "configs/evaluation/inference-efficiency.toml"

[benchmarks.run]
# The canonical held-out reading, plus legality and the adjudicated decisions.
config = "configs/evaluation/lichess-univ-2018-01-2021-06-checkpoint.toml"

[benchmarks.dependency]
# Whether the model reads its rating conditioning, which is a correctness
# question rather than a quality one. It declares its own view because it pays
# eight forward passes per batch where the reading above pays one, and what it
# asks does not need the resolution a move-loss delta does; its own file
# carries that argument.
config = "configs/evaluation/rating-dependency.toml"

[benchmarks.novelty]
# Capability retention across the dose axis.
config = "configs/evaluation/novelty-dose-response.toml"

[benchmarks.puzzles]
# Rating response against the owned calibrated puzzle set.
#
config = "configs/evaluation/puzzle-rating-response.toml"

[benchmarks.rollout]
# The first generating step, and the one whose games the decomposition below
# reads.
config = "configs/evaluation/generated-play-rollout.toml"

[benchmarks.decisions]
# Model error against sampling error, over the games the rollout just played.
# It runs after the rollout because it reads that payload, which the sweep
# enforces rather than trusting to declaration order.
#
# Not recorded, and not by choice of this file: decision decomposition has no
# result kind, because a decomposition is read per cell of the dials it was
# made under and the project has not designated which cell a committed series
# would follow.
record = false

[benchmarks.termination]
# How the checkpoint ends games, against the human termination mix.
config = "configs/evaluation/game-termination.toml"

[benchmarks.ladder]
# The only head-to-head strength reading.
#
# Its cost is quadratic in its seat count, and the seat count is the
# measurement, so the seat grid is not a dial: a ladder fitted on a different
# set of seats cannot be read against this one at all, since the fit places
# every seat on one internal scale.
config = "configs/evaluation/rating-ladder.toml"
