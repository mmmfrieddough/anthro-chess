# This file states the pin and the design. The rows selected under them are
# vendored beside the puzzles package, and `anthro eval prepare-puzzles`
# refuses to build unless the two agree, so re-pinning here without rerunning
# `scripts/vendor-puzzle-selection.py` fails rather than mislabels.

artifact_name = "lichess-puzzles-v1"
name = "anthro-lichess-puzzles"
version = 1
source_retrieved = "2026-08-08"
source_last_modified = 2026-08-02T07:23:55Z
expected_entries = 20000
# Filled from the deterministic selection and verified on every build.
expected_puzzles_sha256 = "a5386d7764b771637f2687d53988d3fcd2b302ef386628d4e6af6879fbcf8e92"

# Provenance for the vendored selection, and the input the vendoring script
# re-derives it from. Ordinary builds never fetch this.
[archive]
url = "https://database.lichess.org/lichess_db_puzzle.csv.zst"
# Names a local copy only; the URL above serves one rolling object and no dated
# puzzle export, so this date is never a path upstream will answer.
file_name = "lichess_db_puzzle_2026-08-02.csv.zst"
sha256 = "a0ea9129c6b6434dfb34a9ac4ec660c9cfff22b2de465e01854f018fc847f073"
compression = "zstd"

[selection]
minimum_rating = 800
maximum_rating_exclusive = 2800
puzzles_per_rating = 10
minimum_plays = 100
minimum_popularity = 0
maximum_rating_deviation = 100
local_precision_span = 400
