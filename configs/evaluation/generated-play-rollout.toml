# What whole generated games look like, across a declared rollout matrix.
#
# The model selection is deliberately absent: with no explicit checkpoint or
# run, `anthro eval rollout` uses the machine-local default selection beneath
# ANTHRO_CHESS_RUN_ROOT, the same record the playable engine reads. Override it
# for one run with, for example:
#
#   anthro eval rollout --config <this file> --set model.run_path='"blitz-v3"'
#
# Every cell of the matrix is its own measurement and its own stored result.
# Values that decide *what* is measured are part of series identity: the arm,
# each rating, each temperature, `generation.maximum_generated_plies`,
# `generation.swap_colors`, `generation.claim_draws`, both
# `runtime.*_enabled` switches, and `guardrails.premature_material_balance`.
# Values that decide only how precisely are not:
# `grid.seeds`, `generation.games_per_position`, and `generation.concurrency`
# can all be raised without ending a series.
#
# Rollout metrics are irreducibly sampled, so raising the game count is the
# only way to narrow them. The counts below are a routine reading; a headline
# reading wants considerably more games per cell.
#
# The human-prefix arm is left out of this selection: repertoire and opening
# readings are only statements about the model on the standard-start arm, since
# a prefix decides the opening before the model moves. Add it with:
#
#   --set arms='["standard-start", "human-prefix"]'
arms = ["standard-start"]

# The pool supplies both the human reference every curve is compared against and
# the openings the human-prefix arm continues.
pool = "artifacts/lichess-univ-2018-01-2021-06-test"
# The generation this reading is defined over. A superseded pool left at that
# path is refused rather than scored.
expected_pool_game_ids_sha256 = "8ff80e72aac7dadd07a418e0c951d3c56a1045a48cd74de903da00bc4525a94c"

[runtime]
# Rating, temperature, and seed are supplied per cell and per game, so setting
# them here would be overridden. Both terminal actions are on: humans end
# better than a third of their games by resigning, so a seat that cannot
# resign plays every lost position out to mate and its length, result, and
# termination distributions are held away from any human population by a gap
# no checkpoint can close. The switches join the declared workload, so a run
# with them off cannot share a series with this one.
resignation_enabled = true
draw_claim_enabled = true

[grid]
# Ratings spanning the range the corpus actually covers, so a rating response
# has somewhere to show up. More points than three: the curve comparison
# estimates the model at every grid rating, and a point with no generated game
# nearby drops out of the conditional reading rather than being interpolated. Temperature is a separate axis because it
# is a separate dial; zero is included deliberately as the degenerate case that
# makes every game from a position identical, which is what a collapsed
# distinct-game fraction should be read against.
target_ratings = [1100, 1300, 1500, 1700, 1900, 2100]
temperatures = [0.0, 0.7, 1.0]
# Replicates of a cell, and precision alone. The temperature-zero row plays the
# first seed by itself and one game per position, and records the count it
# realized: two games, the colour assignments declared below.
seeds = [0, 1, 2, 3, 4]

[generation]
# Long enough for a real game to finish and short enough that a checkpoint
# shuffling in a drawn endgame does not run the suite for hours.
maximum_generated_plies = 300
games_per_position = 256
swap_colors = true
# The seats have a draw-claim action of their own, so claiming for them would
# report the harness's policy as the model's behavior. Games still end on their
# own through the fivefold and seventy-five-move rules.
claim_draws = false
# Games in flight at once, which is also the model's batch size. One call
# offers as many plans as the colour swap and the games per position make, so
# raising this past that product widens nothing.
concurrency = 512

[prefix.view]
# Declared even though `arms` leaves the human-prefix arm out: the roots it
# would continue have to be the population the reference is read at, or every
# distance would be measured between two speed classes. Its size and name are
# the defaults, restated because a dotted override cannot add one key to a
# table this file never declared.
name = "rollout-prefix"
maximum_games = 32
speed = "blitz"
rating_namespace = "lichess_blitz"

[reference]
# Compare generated play against matched human play. This is what turns the
# rollout scalars into a statement about human-likeness: a smaller distance to
# humans of the same rating is better, which the raw scalars cannot say.
enabled = true
# A game whose players are far apart is a mismatch rather than a game at the
# average of its two ratings, so it is excluded from the reference.
maximum_rating_gap = 200
# Resamples behind every distance's floor and reference level. A sample count,
# so raising it narrows the floors without ending a series.
resamples = 200

[reference.view]
# Sized from the bandwidth rather than from what can be afforded. The declared
# smoothing is a neighbour count, so this number *is* the smoothing radius: at
# 2,000 selected games a single neighbourhood spanned 620 rating points against
# a grid spaced 200 apart, and the human curve's own rating response read 42%
# below what the whole pool gives. At 12,000 the widest neighbourhood is 180
# points and that response is within 2% of the whole 50,073-game pool.
#
# So it is neither a sample count nor a ceiling to raise later. Reading more
# human play past this narrows nothing the estimator can use, and it is not
# free: every reference game is replayed and classified, so the cost is linear
# in this number. Reading less silently re-smooths every curve, which is why
# this size is not a dial to shrink.
name = "rollout-reference"
maximum_games = 12000
require_ratings = true
# One human population rather than whatever mixture the pool happens to hold.
# The cap above then takes that many games of this class rather than of the
# mixture, which is what keeps the declared bandwidth the declared bandwidth.
# Blitz is the plurality class of the corpus by games and by plies.
speed = "blitz"
# And one rating pool, because rating is this comparison's own axis: every
# reference game is placed at the mean of its two players' ratings, and numbers
# from two pools on one axis are two scales drawn as one.
rating_namespace = "lichess_blitz"

[detail]
# Declared empty so a dotted override can reach it, the way `prefix.view` is:
# whole games and per-decision records are both off by default, since the
# payload tracks the games played per cell and nothing in the suite reads it now
# that the decomposition is computed where the games are. Turn one on for a
# session that means to look at what was played:
#
#   --set detail.retain_games=true
