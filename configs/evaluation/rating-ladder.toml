# The self-play rating ladder, and what temperature costs on it.
#
# Model selection is deliberately absent: with no explicit checkpoint or run,
# `anthro eval ladder` uses the machine-local default selection beneath
# ANTHRO_CHESS_RUN_ROOT, the same record the playable engine reads. Override it
# for one run with, for example:
#
#   anthro eval ladder --config <this file> --set model.run_path='"blitz-v3"'
#
# Every seat plays every other seat, and one joint Bradley-Terry fit places
# them all on one internal scale. That is what makes the temperature response
# and its ablated control comparable: two separate fits would share no origin.
#
# Values that decide *what* is measured are part of series identity: the rating
# grid, the temperature grid, the reference temperature, whether the ablated
# arm is fielded, the opening source, `fit.maximum_spread`,
# `generation.maximum_generated_plies`, `generation.swap_colors`,
# `generation.claim_draws`, and `runtime.resignation_enabled`. Values that
# decide only how precisely are not: `grid.seeds`,
# `generation.games_per_position`, `generation.concurrency`, `workers`, and the
# `noise.*` settings can all be raised without ending a series.
#
# What the reading can resolve is estimated by redrawing each pairing's games
# and running the fit again, which is what reaches ordering and the ladder
# error: neither has a derivative for a standard error to be propagated
# through. The schema owns the resample count and the rest of `noise.*`,
# and `docs/decisions/0034-qualifying-a-rating-ladder-reading.md` owns why.
#
# Cost scales with the square of the seat count. Eight ratings at three
# temperatures plus three ablated seats is twenty-seven seats and three hundred
# and fifty-one pairings, so raise the grid deliberately rather than by habit.
# Playing only some of them is not the saving it looks like:
# `docs/decisions/0064-the-complete-round-robin-is-the-optimal-ladder-design.md`
# measures what a subset costs.
#
# This grid is settled rather than provisional, and openings rather than seeds
# are what buy precision on it:
# `docs/decisions/0080-the-ladder-widens-and-openings-replace-seeds.md`.

[runtime]
# Rating, temperature, and seed are supplied per seat and per game, so setting
# them here would be overridden. Resignation stays off: a seat that resigns
# ends a game on a model action rather than on the board, which would put the
# resignation policy into the fitted rating.
resignation_enabled = false

[grid]
# Even steps across the range the corpus actually covers, from its sixth
# percentile to its ninetieth. Spacing is what the ordering metrics resolve:
# neighbours far enough apart to separate on any model tell a reader nothing,
# and a round robin carries the scale through the chain of adjacent pairs even
# where the distant ones become shutouts.
target_ratings = [1050, 1200, 1350, 1500, 1650, 1800, 1950, 2100]
# Three points is the fewest that shows a temperature response as a shape
# rather than as a line through two points. Zero is included deliberately: it
# is the degenerate sampling case, and the openings below are what keep its
# games from all being the same game.
temperatures = [0.0, 0.7, 1.0]
# Every calibration figure is declared against this temperature, and the joint
# fit is anchored on its conditioned row.
reference_temperature = 1.0
# One replicate. A seed redraws the sampling in a game the openings already
# chose, so it narrows one of the two things that move a reading and leaves the
# other alone; the opening count below narrows both, because more openings are
# also more games.
seeds = [0]

[ablation]
# One seat per temperature with no rating conditioning at all, fielded in the
# same round robin. Without it the temperature response has no control and the
# attenuation cannot be computed.
enabled = true

[openings]
# Frozen human openings rather than the standard position. Two deterministic
# seats replay one game however many times they are asked, so a ladder that
# includes low temperatures needs its variety to come from the position source
# instead of from sampling.
pool = "artifacts/lichess-univ-2018-01-2021-06-test"
# The generation these openings are drawn from. A superseded pool left at that
# path is refused rather than played.
expected_pool_game_ids_sha256 = "8ff80e72aac7dadd07a418e0c951d3c56a1045a48cd74de903da00bc4525a94c"
plies = 8

[openings.view]
name = "ladder-openings"
# Openings, played from both sides by every pairing. This is the precision
# dial: raising it narrows both the sampling spread and the spread across which
# openings were drawn, and it is the only one of the two that reaches a pairing
# of greedy seats, which replays whatever it is given.
maximum_games = 48
# One human population rather than whatever mixture the pool happens to hold.
# Every pairing plays the same roots, so a mixed draw reaches every seat's
# fitted rating. Blitz is the plurality class of the corpus by games and by
# plies, and the class with enough rated volume to fill every rating band.
speed = "blitz"
# And one rating pool. A rating is a number in a pool rather than a point on
# one scale, so a reading whose subject is the rating dial names the pool it is
# defined over. Not implied by the class above: the two read different fields,
# and only this one says what a number meant. `0058` starts the corpus after
# the rapid split, which is what makes the source's label evidence at all.
rating_namespace = "lichess_blitz"

[generation]
# A round number that sits just past the end of the trained ply range: with the
# eight-ply prefix above this takes its last decision at ply index 307, and the
# longest game in the corpus the model trained on is 301 plies. Raising it would
# score games from ply indices the model has no training signal at, and lowering
# it buys no throughput. A game that hits the limit has no result and informs no
# pairwise comparison; it is counted rather than adjudicated into a draw, which
# makes the count a reading about the seats rather than about this value.
# Settled in `docs/decisions/0030-ladder-ply-limit-at-the-trained-bound.md`.
maximum_generated_plies = 300
games_per_position = 1
swap_colors = true
# The model has no draw-claim action, so claiming for it would report the
# harness's policy as the seats' behavior.
claim_draws = false
# Games one worker keeps in flight, which is what decides how many decisions
# reach the model in one pass. A wave never exceeds the plans one replicate
# offers, which is the opening count above times the colour assignments, so
# this is that product rather than a free dial.
concurrency = 96

[fit]
# How far a seat may sit from the anchor. A seat that won or lost every game
# has no finite maximum-likelihood rating, so this turns a runaway fit into a
# reportable extreme. It joins series identity because it can change a value.
maximum_spread = 1200.0

[detail]
# Whole games, machine-local. Each is written once, under the seat that held
# white, so a later analysis pass can recompute features without replaying the
# ladder.
retain_games = true
