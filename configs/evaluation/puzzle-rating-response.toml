# Rating response against the owned, human-calibrated Lichess puzzle set.
#
# Model selection is deliberately absent, so the command uses the same
# machine-local default checkpoint as the playable engine. The puzzle-rating
# scale is external and separate from the configured Lichess game-rating
# scale: this benchmark measures ordering and slope, not absolute strength.
#
# Run with:
#
#   anthro eval puzzles --config configs/evaluation/puzzle-rating-response.toml

# The overlap join includes train and validation games and excludes the test
# partition, which training never consumes. ANTHRO_CHESS_DATA_ROOT relocates
# this checked-in relative artifact path.
training_normalized = "artifacts/lichess-blitz-2017-04"

target_ratings = [1000, 1400, 1800, 2200]
reference_temperature = 1.0
inference_batch_size = 32
