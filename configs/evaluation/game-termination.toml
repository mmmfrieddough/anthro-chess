# What the policy says about resigning, at positions humans actually reached.
#
# The model selection is deliberately absent: with no explicit checkpoint or
# run, `anthro eval termination` uses the machine-local default selection
# beneath ANTHRO_CHESS_RUN_ROOT, the same record the playable engine reads.
# Override it for one run with, for example:
#
#   anthro eval termination --config <this file> \
#     --set model.run_path='"blitz-v3"'
#
# Nothing is generated here, so the reading is scoped by the human content it
# scored rather than by a generation recipe: the view and the pool decide what
# the series is, and `loader.*` only decides how the pass is batched. How a
# checkpoint's own games end is a property of generated play and is read by
# `anthro eval rollout`, over games it plays with both terminal actions on.

pool = "artifacts/lichess-univ-2018-01-2021-06-test"
# The generation this reading is defined over. A superseded pool left at that
# path is refused rather than scored.
expected_pool_game_ids_sha256 = "8ff80e72aac7dadd07a418e0c951d3c56a1045a48cd74de903da00bc4525a94c"

[view]
name = "termination-held-out"
# Every ply of every selected game is scored, so this is sized by scoring cost.
# The binding half is the plies where a human resigned: roughly three games in
# ten carry one, and they are the numerator of every calibration band. At 4096
# games the deepest band holds enough of them to separate a checkpoint from
# itself, which 512 did not.
maximum_games = 4096

[detail]
# Per-decision resignation mass, machine-local. The one payload that makes an
# unexpected reading explainable, and one row per scored ply: at the view size
# above that is around 275,000 rows per checkpoint, in a tier nothing prunes.
# Turn it off for a cadence that reads more often than it looks.
retain_decisions = true
