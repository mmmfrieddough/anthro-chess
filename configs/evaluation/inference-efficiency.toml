# What a checkpoint costs to play with, and what a model change costs it.
#
# The model selection is deliberately absent: with no explicit checkpoint or
# run, `anthro eval inference` uses the machine-local default selection beneath
# ANTHRO_CHESS_RUN_ROOT, the same record the playable engine reads. Override it
# for one run with, for example:
#
#   anthro eval inference --config <this file> --set model.run_path='"blitz-v3"'
#
# This benchmark reads no evaluation pool. Latency depends on history length and
# legal-move count rather than on which human played the game, so the workload
# is a seeded synthetic walk and the series survives a pool cut.
#
# A run on an accelerator also measures the host, and the two do not pool: the
# device is part of each reading's declared workload. That reading answers two
# things nothing else here does. Whether the engine is playable without an
# accelerator, and what a model change costs in a wall clock at all, since one
# 64-token forward is too small to occupy an accelerator and its batch-one
# latency barely moves between model sizes.
#
# Every value below that decides *what* is measured is part of series identity,
# but not all of one series: the product timings are declared on the serving
# batch and the latency depth, and the compute instrument on its own batch, so
# moving the instrument does not end their history. Sample counts are outside
# identity, and so is `processes`: raising them measures the same quantity more
# precisely.

# Processes this reading is taken in, itself included, each one a whole reading.
# Where a process lands is nearly all of the run-to-run noise, so measuring more
# decisions inside one buys nothing and this is the only lever. The committed
# value is their mean and the floor is that mean's own spread, so both halves
# move with this number. Below four the chi-square limit on an estimated spread
# costs more than the pooling wins. Set it to 1 for an exploratory reading with
# no floor and no pooling.
processes = 6

[runtime]
# Fixed so the measured decisions are reproducible. Temperature is recorded in
# the workload because it changes the sampling work per decision.
seed = 0
temperature = 1.0
target_rating = 1500

[latency]
# Move twenty: a real midgame decision rather than an opening position whose
# short history would flatter a full-history model. One depth rather than a
# sweep, because the model reads a fixed number of square tokens and folds
# history into their channels rather than into the sequence.
reference_plies = 40
decisions = 100
warmup_decisions = 5

[throughput]
# Concurrent players, at the point where the throughput curve has flattened but
# a move still comes back in tens of milliseconds rather than a visible pause.
serving_batch_size = 64
# An instrument rather than an operating point: nothing serves this wide, and it
# is where the accelerator stops being launch bound and the forward pass starts
# reflecting how much arithmetic the model does.
compute_batch_size = 256
history_plies = 40
batches = 30
warmup_batches = 3
