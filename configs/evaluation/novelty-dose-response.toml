# Capability retention under a controlled novelty dose.
#
# Perturbed continuations are derived from the frozen pool through the shared
# view layer. Only the opponent's moves are replaced, and only from the onset
# ply onward; the player's continuation is the human's own, replayed while it
# stays legal. See `docs/evaluation.md` for what survives out of distribution
# and why the perturbed arms are read as retention rather than as rates.
#
# The model selection is deliberately absent: with no explicit checkpoint or
# run, `anthro eval novelty` uses the machine-local default selection beneath
# ANTHRO_CHESS_RUN_ROOT.
pool = "artifacts/lichess-univ-2018-01-2021-06-test"
# The generation this reading is defined over. A superseded pool left at that
# path is refused rather than scored.
expected_pool_game_ids_sha256 = "8ff80e72aac7dadd07a418e0c951d3c56a1045a48cd74de903da00bc4525a94c"

[view]
# Games have to be long enough for the window to open and run, so this view
# filters on length. Subsampling keeps a sweep affordable without shrinking the
# pool the reading is defined over.
#
# Sized on the headline quantity, which is the policy mass on a minor-piece or
# better material win at full dose. Five independent draws at 1600 games put
# its spread at 0.0059, against 0.0190 between the weakest and strongest
# checkpoint on this machine: 3.2 times the floor across sixty-four times the
# training. That gap is coarse next to the arms this has to separate later, and
# four times the games halves the floor.
name = "novelty"
minimum_plies = 40
maximum_games = 6400

[perturbation]
# Dose zero is the control arm and is required. The sweep is denser at the low
# end because that is where the curve is expected to be non-monotonic: a small
# perturbation takes the model off book without yet giving away material.
doses = [0.0, 0.0625, 0.125, 0.25, 0.5, 1.0]
onset_plies = 16
window_moves = 8

[loader]
# Every arm is a separate pass, so this reading is more launch-bound than one
# that scores the pool once. Measured over one full-dose arm, the forward pass
# and the gather beside it fall from 1.56s at 8 to 0.99s at 32, and 256 buys a
# further 0.05s: past 32 the launches are paid for and what is left scales with
# positions.
batch_size = 32
