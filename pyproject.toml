[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "anthro-chess"
dynamic = ["version"]
description = "A controllable chess model intended to mimic human play."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Anthro Chess contributors" },
]
keywords = ["chess", "machine-learning", "pytorch"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chess>=1.11,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
data = [
    "numpy>=2,<3",
    "pyarrow>=21,<22",
    "zstandard>=0.23,<1",
]
model = [
    "numpy>=2,<3",
    "tensorboard>=2.20,<3",
    "torch>=2.7,<3",
]

[project.scripts]
anthro = "anthro_chess.interfaces.cli:main"
anthro-uci = "anthro_chess.interfaces.uci:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "numpy>=2,<3",
  "pre-commit>=4.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pyarrow>=21,<22",
  "ruff>=0.11",
  "tensorboard>=2.20,<3",
  "torch>=2.7,<3",
  "zstandard>=0.23,<1",
  "pytest-xdist>=3.6",
]

[project.urls]
Repository = "https://github.com/mmmfrieddough/anthro-chess"
Issues = "https://github.com/mmmfrieddough/anthro-chess/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/anthro_chess"]

[tool.hatch.version]
path = "src/anthro_chess/__init__.py"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -n auto"
testpaths = ["tests"]
markers = [
  "slow: tests that are too slow for the default local suite",
  "gpu: tests that require a supported GPU",
  "network: tests that require network access",
  "integration: tests that exercise multiple system boundaries",
]

[tool.coverage.run]
branch = true
source = ["anthro_chess"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# Modules the suite imports from its own directory. Without this they sort in
# among PyPI packages, where a reader has no way to tell the two apart.
known-local-folder = ["accelerators"]
