repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Upstream serves one rolling puzzle export with no history, so the
        # vendored selection is the only surviving copy of the rows a reading
        # was taken against.
        exclude: ^src/anthro_chess/evaluation/puzzles/data/puzzles\.csv$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
